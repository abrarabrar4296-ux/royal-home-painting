[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**", "services/**", "db/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/leads"
  to = "/leads.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/leads.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/leads.html"
  status = 200

