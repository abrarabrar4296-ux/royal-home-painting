<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@700&amp;display=swap');
      .brand-royal { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 26px; fill: #000000; letter-spacing: 1.5px; }
      .brand-home { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 26px; fill: #000000; letter-spacing: 1.5px; }
      .brand-sub { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 9.5px; fill: #F0620D; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- Left text: ROYAL -->
  <text x="5" y="44" class="brand-royal">ROYAL</text>

  <!-- Middle Emblem: House Outline Accent & Paint Roller in Brand Orange (#F0620D) -->
  <g transform="translate(132, 8)">
    <!-- House Outline -->
    <path d="M 24 3 L 44 20 L 38 20 L 38 46 L 10 46 L 10 20 L 4 20 Z" 
          fill="none" stroke="#F0620D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Paint Roller inside/overlapping house -->
    <!-- Roller Cylinder -->
    <rect x="14" y="16" width="20" height="9" rx="2.5" fill="#F0620D"/>
    <!-- Wet paint drip accent -->
    <path d="M 18 25 Q 19 28 20 25 M 26 25 Q 27.5 30 29 25" stroke="#C44A05" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Roller Metal Handle Rod -->
    <path d="M 34 20.5 L 37 20.5 L 37 32 L 24 32 L 24 40" 
          fill="none" stroke="#14495F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wooden Grip Handle -->
    <rect x="21.5" y="40" width="5" height="11" rx="1.5" fill="#14495F"/>
    <rect x="22.5" y="42" width="3" height="7" rx="0.5" fill="#2E6C87"/>
  </g>

  <!-- Right text: HOME PAINTING -->
  <text x="194" y="44" class="brand-home">HOME PAINTING</text>
  <text x="196" y="58" class="brand-sub">SIMPLE &bull; SEAMLESS &bull; SATISFACTION</text>
</svg>
